services:

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d movie_review"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=owner
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=movie_review
    ports:
      - "5432:5432"

volumes:
  app-db-data: